<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>DIGIY BONNE AFFAIRE — Vitrine</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#0b1020" />
  <meta name="description" content="DIGIY BONNE AFFAIRE — Vitrine publique. 0% commission. Contact direct WhatsApp." />

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Guard BONNE AFFAIRE (slug-safe + session) -->
  <script src="./guard.js?v=ba-guard"></script>

  <style>
    :root{
      --bg:#020617;
      --bg2:#020818;
      --card:#0b1020;
      --card2:#030712;
      --line:rgba(148,163,184,.22);
      --ink:#f9fafb;
      --muted:#cbd5f5;
      --accent:#f97316;
      --accent2:#facc15;
      --ok:#22c55e;
      --bad:#fb7185;
      --shadow:0 20px 55px rgba(0,0,0,.55);
      --shadow2:0 12px 30px rgba(15,23,42,.9);
      --radius:22px;
    }
    *{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,Segoe UI,Roboto}
    body{
      min-height:100vh;
      background:
        radial-gradient(circle at top, rgba(249,115,22,.16), transparent 55%),
        radial-gradient(circle at bottom, rgba(34,197,94,.12), transparent 55%),
        linear-gradient(135deg,var(--bg),var(--bg2));
      color:var(--ink);
      padding:12px;
      display:flex;
      justify-content:center;
    }
    a{color:inherit}
    .app{
      width:100%;
      max-width:1100px;
      background:rgba(2,6,23,.35);
      border:1px solid var(--line);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      overflow:hidden;
      position:relative;
    }
    .app::before{
      content:"";
      position:absolute;inset:-40%;
      background:
        radial-gradient(circle at 0% 0%,rgba(249,115,22,.12),transparent 55%),
        radial-gradient(circle at 100% 100%,rgba(34,197,94,.10),transparent 45%);
      opacity:.9;
      pointer-events:none;
    }

    /* TOPBAR */
    .topbar{
      position:relative;z-index:2;
      padding:14px;
      display:flex;
      gap:10px;
      justify-content:space-between;
      align-items:center;
      flex-wrap:wrap;
      border-bottom:1px solid var(--line);
      background:rgba(11,16,32,.78);
      backdrop-filter: blur(8px);
    }
    .brand{display:flex;gap:10px;align-items:center}
    .logo{
      width:42px;height:42px;border-radius:14px;
      display:grid;place-items:center;
      background:linear-gradient(135deg,var(--accent),#ea580c);
      color:#111827;font-weight:1000;
      box-shadow:0 12px 28px rgba(249,115,22,.55);
      font-size:20px;
    }
    .bt{display:flex;flex-direction:column;gap:2px}
    .title{
      font-weight:1000;letter-spacing:.06em;
      text-transform:uppercase;
      color:var(--accent);
      font-size:14px;
    }
    .sub{color:var(--muted);font-weight:800;font-size:12px}
    .right{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}

    .pill{
      font-size:12px;
      padding:6px 10px;
      border-radius:999px;
      border:1px solid rgba(148,163,184,.28);
      background:rgba(2,6,23,.55);
      color:var(--muted);
      font-weight:900;
      white-space:nowrap;
    }

    .btn{
      border:none;
      border-radius:999px;
      padding:10px 14px;
      font-weight:1000;
      cursor:pointer;
      display:inline-flex;
      align-items:center;
      gap:8px;
      white-space:nowrap;
      transition:transform .18s, box-shadow .18s, border-color .18s;
      justify-content:center;
      text-decoration:none;
      user-select:none;
    }
    .btn-main{
      background:linear-gradient(135deg,var(--accent),#ea580c);
      color:#111827;
      box-shadow:0 10px 22px rgba(249,115,22,.45);
    }
    .btn-main:hover{transform:translateY(-1px);box-shadow:0 14px 28px rgba(249,115,22,.62)}
    .btn-ghost{
      background:rgba(2,6,23,.55);
      color:var(--ink);
      border:1px solid rgba(148,163,184,.35);
    }
    .btn-ghost:hover{border-color:rgba(249,115,22,.65)}
    .btn-ok{
      background:rgba(34,197,94,.15);
      border:1px solid rgba(34,197,94,.55);
      color:#bbf7d0;
    }

    /* CONTENT */
    .content{position:relative;z-index:2;padding:14px;display:flex;flex-direction:column;gap:12px}
    .toast{
      padding:10px 12px;
      border-radius:14px;
      border:1px solid rgba(148,163,184,.25);
      background:rgba(0,0,0,.20);
      font-weight:900;
      font-size:12px;
      min-height:18px;
    }
    .toast.ok{border-color:rgba(34,197,94,.45)}
    .toast.bad{border-color:rgba(251,113,133,.45)}

    .panel{
      background:rgba(11,16,32,.72);
      border:1px solid rgba(148,163,184,.22);
      border-radius:22px;
      padding:12px;
      box-shadow:var(--shadow2);
    }
    .panelTop{
      display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px
    }
    .panelTitle{
      font-size:14px;font-weight:1000;color:var(--accent2);
      letter-spacing:.02em;
    }
    .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:flex-end}
    .input,.select{
      background:rgba(2,6,23,.72);
      border:1px solid rgba(148,163,184,.35);
      color:var(--ink);
      border-radius:14px;
      padding:10px 12px;
      font-weight:900;
      outline:none;
      min-width:160px;
    }
    .input{flex:1;min-width:220px}

    .list{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:10px;
    }
    @media(max-width:900px){.list{grid-template-columns:1fr;}}
    .card{
      background:radial-gradient(circle at top,rgba(15,23,42,.95),rgba(2,6,23,.85));
      border:1px solid rgba(148,163,184,.22);
      border-radius:22px;
      padding:12px;
      box-shadow:0 12px 30px rgba(0,0,0,.35);
      position:relative;
      overflow:hidden;
      min-height:160px;
    }
    .card::before{
      content:"";
      position:absolute;inset:-60%;
      background:radial-gradient(circle at 0% 0%, rgba(249,115,22,.08), transparent 55%);
      pointer-events:none;
      opacity:.9;
    }
    .cTop{position:relative;z-index:2;display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
    .cTitle{font-weight:1000;font-size:16px;color:var(--accent)}
    .cBadge{
      font-size:11px;font-weight:1000;
      padding:5px 9px;border-radius:999px;
      border:1px solid rgba(148,163,184,.28);
      background:rgba(2,6,23,.55);
      color:var(--muted);
      white-space:nowrap;
    }
    .cMeta{position:relative;z-index:2;margin-top:8px;color:#e5e7eb;font-weight:800;font-size:12px;display:flex;gap:8px;flex-wrap:wrap}
    .tag{
      border:1px solid rgba(148,163,184,.25);
      border-radius:999px;
      padding:5px 9px;
      background:rgba(2,6,23,.55);
      color:rgba(203,213,245,.92);
    }
    .tag.ok{border-color:rgba(34,197,94,.45);color:#bbf7d0;background:rgba(34,197,94,.10)}
    .cDesc{position:relative;z-index:2;margin-top:8px;color:#f3f4f6;font-weight:700;font-size:13px;line-height:1.5}
    .cBtns{position:relative;z-index:2;margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
    .btn-small{padding:9px 12px;font-size:12px}
  </style>
</head>

<body>
  <div class="app" id="app">
    <div class="topbar">
      <div class="brand">
        <div class="logo">🏪</div>
        <div class="bt">
          <div class="title">DIGIY BONNE AFFAIRE — VITRINE</div>
          <div class="sub">0% commission • Contact direct • Deals terrain</div>
        </div>
      </div>

      <div class="right">
        <div class="pill" id="pillSlug">slug: —</div>

        <a class="btn btn-ghost" id="btnGoPin" href="./pin.html">🔐 GO PIN</a>
        <button class="btn btn-main" id="btnGoCockpit">🧭 Cockpit PRO</button>
        <button class="btn btn-ok" id="btnPublish">➕ Publier</button>
      </div>
    </div>

    <div class="content">
      <div class="toast" id="toast">🔎 Chargement vitrine…</div>

      <div class="panel">
        <div class="panelTop">
          <div class="panelTitle">Annonces disponibles</div>
          <div class="row">
            <select class="select" id="fCategory">
              <option value="">Toutes catégories</option>
              <option value="occaz">♻️ Occaz</option>
              <option value="service">🛠️ Service</option>
              <option value="pro">🏪 Pro</option>
            </select>
            <input class="input" id="q" placeholder="Recherche… (titre / zone / slug)" />
            <button class="btn btn-ghost btn-small" id="btnReset">🧹 Reset</button>
            <button class="btn btn-ghost btn-small" id="btnRefresh">🔄</button>
          </div>
        </div>

        <div class="list" id="list"></div>
      </div>
    </div>
  </div>

  <script>
  (function(){
    "use strict";

    const $ = (id)=>document.getElementById(id);

    function qp(k){
      try{ return (new URLSearchParams(location.search).get(k) || "").trim(); }
      catch(_){ return ""; }
    }

    function esc(s){
      return String(s||"")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    function toast(msg, kind){
      const el = $("toast");
      if(!el) return;
      el.textContent = msg || "";
      el.classList.remove("ok","bad");
      if(kind) el.classList.add(kind);
    }

    function money(n){
      const x = Number(n||0);
      if(!isFinite(x) || x<=0) return "";
      return Math.round(x).toLocaleString("fr-FR");
    }

    function waLink(phone, msg){
      const p = String(phone||"").replace(/[^\d]/g,"");
      return "https://wa.me/" + p + "?text=" + encodeURIComponent(msg||"");
    }

    const CTX = { slug:"" };
    function setSlugPill(){
      const el = $("pillSlug");
      if(el) el.textContent = "slug: " + (CTX.slug || "—");
    }

    async function boot(){
      try{
        if(window.DIGIY_GUARD?.boot){
          await window.DIGIY_GUARD.boot({ login: "./pin.html" }); // public ok
        }
      }catch(_){}

      CTX.slug = (qp("slug") || (window.DIGIY_GUARD?.getSlug ? window.DIGIY_GUARD.getSlug() : "") || localStorage.getItem("DIGIY_SLUG") || "").trim();
      setSlugPill();

      // slug-safe GO PIN
      if(window.DIGIY_GUARD?.withSlug){
        const a = $("btnGoPin");
        if(a) a.href = window.DIGIY_GUARD.withSlug("./pin.html");
      }
    }

    function getSb(){
      if(window.DIGIY_GUARD?.getSb){
        const x = window.DIGIY_GUARD.getSb();
        if(x) return x;
      }
      const SUPABASE_URL = "https://wesqmwjjtsefyjnluosj.supabase.co";
      const SUPABASE_ANON_KEY =
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indlc3Ftd2pqdHNlZnlqbmx1b3NqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjUxNzg4ODIsImV4cCI6MjA4MDc1NDg4Mn0.dZfYOc2iL2_wRYL3zExZFsFSBK6AbMeOid2LrIjcTdA";
      if(!window.supabase?.createClient) return null;
      if(!window.__ba_public_sb__) window.__ba_public_sb__ = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      return window.__ba_public_sb__;
    }

    const RPC_PUBLIC = "ba_list_ads"; // si tu la poses plus tard, la vitrine l'utilise direct
    let ALL = [];

    async function callRpc(name, payload){
      const sb = getSb();
      if(!sb) return { ok:false, error:"Supabase non prêt" };
      const { data, error } = await sb.rpc(name, payload || {});
      if(error) return { ok:false, error:error.message };
      return { ok:true, data };
    }

    async function loadPublic(){
      toast("⏳ Chargement annonces publiques…", "");

      // 1) RPC public si elle existe
      const r = await callRpc(RPC_PUBLIC, { p_category: null, p_location: null });
      if(r.ok){
        const items = (r.data && r.data.items) ? r.data.items : (Array.isArray(r.data) ? r.data : []);
        ALL = items || [];
        toast("✅ Vitrine chargée — " + ALL.length + " annonce(s).", "ok");
        applyFilters();
        return;
      }

      // 2) fallback table directe (si RLS autorise public read)
      try{
        const sb = getSb();
        const { data, error } = await sb
          .from("digiy_ba_ads")
          .select("id,slug,category,title,description,price,currency,whatsapp,location,is_active,status,is_featured,pickup_enabled,updated_at,created_at")
          .eq("is_active", true)
          .eq("status", "active")
          .order("is_featured", { ascending:false })
          .order("updated_at", { ascending:false });

        if(error) throw error;
        ALL = data || [];
        toast("✅ Vitrine chargée — " + ALL.length + " annonce(s).", "ok");
        applyFilters();
        return;
      }catch(e){
        ALL = [];
        toast("⚠️ Vitrine indisponible (RPC public non posée / RLS). Pose ba_list_ads ou autorise lecture publique.", "bad");
        render([]);
      }
    }

    function render(items){
      const el = $("list");
      if(!el) return;

      if(!items || items.length===0){
        el.innerHTML = `
          <div class="toast" style="grid-column:1/-1">
            Aucune annonce visible pour le moment.
          </div>
        `;
        return;
      }

      el.innerHTML = "";
      for(const it of items){
        const title = it.title || "Annonce";
        const slug  = it.slug || "";
        const cat   = it.category || "—";
        const loc   = it.location || "—";
        const cur   = it.currency || "XOF";
        const pTxt  = money(it.price || 0);
        const price = pTxt ? (pTxt + " " + cur) : "—";
        const wa    = it.whatsapp || "";

        const desc  = (it.description || "").trim();
        const id    = it.id || "";

        const msg = `Salut, je viens de DIGIY BONNE AFFAIRE. Je suis intéressé par: ${title} (slug: ${slug}).`;

        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <div class="cTop">
            <div>
              <div class="cTitle">${esc(title)}</div>
              <div class="cMeta">
                <span class="tag">🏷️ ${esc(cat)}</span>
                <span class="tag">📍 ${esc(loc)}</span>
                <span class="tag">💰 ${esc(price)}</span>
                ${it.pickup_enabled ? `<span class="tag ok">📦 Retrait</span>` : ``}
              </div>
            </div>
            <div class="cBadge">${esc(String(id||"").slice(0,8) || "—")}</div>
          </div>

          <div class="cDesc">${esc(desc || "—")}</div>

          <div class="cBtns">
            ${wa ? `<a class="btn btn-main btn-small" href="${waLink(wa, msg)}" target="_blank" rel="noopener">💬 WhatsApp</a>` : `<span class="tag">WhatsApp non dispo</span>`}
            <button class="btn btn-ghost btn-small" data-act="copy" data-id="${esc(id)}">📋 Copier</button>
          </div>
        `;
        el.appendChild(card);
      }

      el.querySelectorAll("button[data-act='copy']").forEach(btn=>{
        btn.addEventListener("click", async ()=>{
          const id = btn.getAttribute("data-id") || "";
          const found = (items||[]).find(x => String(x.id||"")===String(id));
          const payload = found ? JSON.stringify(found, null, 2) : ("Annonce: "+id);
          try{
            await navigator.clipboard.writeText(payload);
            toast("✅ Copié.", "ok");
          }catch(_){
            toast("⚠️ Copie impossible.", "bad");
          }
        });
      });
    }

    function applyFilters(){
      const cat = ($("fCategory")?.value || "").trim().toLowerCase();
      const q = ($("q")?.value || "").trim().toLowerCase();

      const out = (ALL||[]).filter(it=>{
        const c = String(it.category||"").toLowerCase();
        const hay = (String(it.title||"")+" "+String(it.slug||"")+" "+String(it.location||"")).toLowerCase();
        const okC = !cat || c===cat;
        const okQ = !q || hay.includes(q);
        return okC && okQ;
      });

      render(out);
      if(q || cat) toast("🔎 Filtre actif — " + out.length + " annonce(s).", "");
    }

    function debounce(fn, delay){
      let t=null;
      return (...args)=>{ clearTimeout(t); t=setTimeout(()=>fn(...args), delay); };
    }

    function bindUI(){
      $("btnRefresh") && ($("btnRefresh").onclick = ()=> loadPublic());
      $("btnReset") && ($("btnReset").onclick = ()=>{
        $("fCategory") && ($("fCategory").value = "");
        $("q") && ($("q").value = "");
        render(ALL);
        toast("🧹 Reset filtres.", "");
      });

      $("fCategory") && ($("fCategory").onchange = applyFilters);
      $("q") && $("q").addEventListener("input", debounce(applyFilters, 120));

      // Publier -> paiement/pack
      $("btnPublish") && ($("btnPublish").onclick = ()=>{
        const u = new URL("https://beauville.github.io/commencer-a-payer/", location.href);
        u.searchParams.set("module","bonne_affaire");
        u.searchParams.set("action","new");
        if(CTX.slug) u.searchParams.set("slug", CTX.slug);
        u.searchParams.set("next", location.pathname + location.search);
        location.href = u.toString();
      });

      // Cockpit PRO -> si pas connecté => GO PIN
      $("btnGoCockpit") && ($("btnGoCockpit").onclick = ()=>{
        const sess = window.DIGIY_GUARD?.getSession?.();
        if(!sess?.owner_id){
          const next = encodeURIComponent("./cockpit.html" + location.search);
          location.href = "./pin.html?next=" + next;
          return;
        }
        if(window.DIGIY_GUARD?.withSlug) location.href = window.DIGIY_GUARD.withSlug("./cockpit.html");
        else location.href = "./cockpit.html";
      });
    }

    document.addEventListener("DOMContentLoaded", async ()=>{
      await boot();
      bindUI();
      await loadPublic();
      console.log("🏪 DIGIY BA PUBLIC READY", { slug: CTX.slug });
    });
  })();
  </script>
</body>
</html>
