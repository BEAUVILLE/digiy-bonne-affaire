name: Fix Bonne Affaire currency
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-bonne-affaire-currency.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stabiliser FCFA et EUR
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('assets/tarifs-annonce.js')
          s = p.read_text()
          old = "let market=localStorage.getItem('ba-market')||'sn';"
          new = "let market='sn';try{localStorage.removeItem('ba-market')}catch(_){}"
          if old not in s:
              raise SystemExit('market persistence marker not found')
          s = s.replace(old, new, 1)

          old = "function render(){const t=c();"
          new = "function render(){const t=c();const proPrice=market==='fr'?'75 €':t.proPrice;"
          if old not in s:
              raise SystemExit('render marker not found')
          s = s.replace(old, new, 1)

          old = '<div class="amount">${t.proPrice}</div>'
          new = '<div class="amount">${proPrice}</div>'
          if old not in s:
              raise SystemExit('pro price marker not found')
          s = s.replace(old, new, 1)

          old = "b.onclick=()=>{market=b.dataset.market;localStorage.setItem('ba-market',market);render()}"
          new = "b.onclick=()=>{market=b.dataset.market;render()}"
          if old not in s:
              raise SystemExit('market click persistence marker not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          h = Path('tarifs-annonce.html')
          x = h.read_text()
          old = './assets/tarifs-annonce.js?v=20260812-pro-28000'
          new = './assets/tarifs-annonce.js?v=20260812-currency-stable-v2'
          if old not in x:
              raise SystemExit('cachebuster marker not found')
          h.write_text(x.replace(old, new, 1))
          PY
          git config user.name "DIGIYLYFE Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/fix-bonne-affaire-currency.yml
          git add assets/tarifs-annonce.js tarifs-annonce.html
          git commit -m "Stabiliser devises BONNE AFFAIRE FCFA et euros"
          git push
