name: Fix Bonne Affaire tarifs render
on:
  push:
    paths:
      - '.github/workflows/fix-tarifs-render.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Stabiliser le chargement des tarifs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('assets/tarifs-annonce.js')
          s=p.read_text()
          old1="const M=window.BA_MOBILE,$=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];"
          new1="let M=window.BA_MOBILE;const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];"
          old2="document.addEventListener('DOMContentLoaded',()=>{M.apply();$$('[data-market]').forEach(b=>b.onclick=()=>{market=b.dataset.market;render()});render()});"
          new2="function boot(){M=window.BA_MOBILE;if(!M||typeof M.apply!=='function'){setTimeout(boot,30);return;}M.apply();$$('[data-market]').forEach(b=>b.onclick=()=>{market=b.dataset.market;render()});render()}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot,{once:true});else boot();"
          if old1 not in s: raise SystemExit('guard old1 missing')
          if old2 not in s: raise SystemExit('guard old2 missing')
          s=s.replace(old1,new1,1).replace(old2,new2,1)
          p.write_text(s)
          PY
      - name: Bump cache tarif page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tarifs-annonce.html')
          s=p.read_text()
          s=s.replace('20260812-currency-stable-v3','20260812-tarifs-render-v4')
          p.write_text(s)
          PY
      - name: Commit correction
        run: |
          git config user.name 'DIGIYLYFE Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add assets/tarifs-annonce.js tarifs-annonce.html
          git commit -m 'Réparer affichage tarifs BONNE AFFAIRE'
          git push origin main
      - name: Retirer workflow temporaire
        run: |
          git pull --rebase origin main
          git rm .github/workflows/fix-tarifs-render.yml
          git commit -m 'Retirer workflow temporaire tarifs'
          git push origin main
