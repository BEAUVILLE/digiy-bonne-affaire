name: Ajouter retour DIGIYLYFE temporaire

on:
  push:
    paths:
      - '.github/workflows/add-digiy-return-temp.yml'

permissions:
  contents: write

jobs:
  patch-return:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Poser le retour HTML direct
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = 'data-digiy-return-home="1"'
          if marker not in s:
              m = re.search(r'<main\b[^>]*>', s, flags=re.I)
              if not m:
                  raise SystemExit('Balise <main> introuvable')
              button = '''\n  <a data-digiy-return-home="1" href="https://digiylyfe.com/" aria-label="Retour DIGIYLYFE.COM" style="width:100%;min-height:52px;display:flex;align-items:center;justify-content:center;margin:0 0 14px;padding:11px 18px;border:2px solid #d8ad46;border-radius:999px;background:#073f32;color:#fff;text-decoration:none;font:950 15px/1.2 system-ui,-apple-system,Segoe UI,sans-serif;letter-spacing:.02em;box-shadow:0 8px 20px rgba(7,63,50,.20)">← RETOUR DIGIYLYFE.COM</a>'''
              s = s[:m.end()] + button + s[m.end():]
              p.write_text(s, encoding='utf-8')
          PY
          git config user.name "DIGIY LYFE"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/add-digiy-return-temp.yml
          git commit -m "UI: add DIGIYLYFE.COM return on BONNE AFFAIRE"
          git push
